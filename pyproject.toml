[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HexaLogic"
version = "1.0.0"
description = "Browser-based multi-architecture (8051/ARM) microcontroller simulation platform"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ashwinder Pal Singh", email = "asingh47_be23@gmail.com" },
]
requires-python = ">=3.9"
dependencies = [
    "Flask>=2.0.2",
    "rich>=11.2.0",
    "gunicorn>=20.1.0",
    "redis>=5.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Emulators",
]

[project.optional-dependencies]
test = ["pytest>=7.0.1"]

[project.urls]
Homepage = "https://www.hexalogic.xyz"
Repository = "https://github.com/AshwinderPalSingh/HEXALOGIC-ONLINE-EMULATOR"
# Paper = "https://doi.org/10.21105/joss.XXXXX"  # fill in once a JOSS DOI is assigned

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
